name: deploy-pages

# 推到 GitHub 后自动构建并发布到 GitHub Pages
# 仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」即可
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，新的提交会取消旧的构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # webpack 4 在 Node 17+ 上要用 legacy provider 才能拿到 md4
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      # GitHub Pages 默认跑 Jekyll，会忽略掉下划线开头的文件
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
